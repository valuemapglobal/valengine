# RiskSmart Gateway Service Configuration
# Nacos Data ID: risk-smart-gateway-dev.yml
# Nacos Group: DEFAULT_GROUP

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ==================== /vm/** 前缀路由 (前端代理) ====================
        # /vm/system/** -> /system/**
        - id: risk-smart-system-vm
          uri: lb://risk-smart-system
          predicates:
            - Path=/vm/system/**
          filters:
            - StripPrefix=1
        # /vm/auth/** -> /auth/**
        - id: risk-smart-auth-vm
          uri: lb://risk-smart-system
          predicates:
            - Path=/vm/auth/**
          filters:
            - StripPrefix=1
        # /vm/smartDecision/** -> /
        - id: risk-smart-decision-vm
          uri: lb://risk-smart-decision-manage
          predicates:
            - Path=/vm/smartDecision/**
          filters:
            - StripPrefix=2
        # /vm/smartData/** -> /
        - id: risk-smart-data-vm
          uri: lb://risk-smart-data-middle-station
          predicates:
            - Path=/vm/smartData/**
          filters:
            - StripPrefix=2
        # ==================== 标准路由 ====================
        # 认证相关路由 (不需要 StripPrefix)
        - id: risk-smart-auth
          uri: lb://risk-smart-system
          predicates:
            - Path=/login,/logout,/captchaImage
        # 系统服务路由
        - id: risk-smart-system
          uri: lb://risk-smart-system
          predicates:
            - Path=/system/**
        # 数据中台路由
        - id: risk-smart-data-middle-station
          uri: lb://risk-smart-data-middle-station
          predicates:
            - Path=/data/**
          filters:
            - StripPrefix=1
        # 决策引擎路由
        - id: risk-smart-decision-manage
          uri: lb://risk-smart-decision-manage
          predicates:
            - Path=/decision/**
          filters:
            - StripPrefix=1
