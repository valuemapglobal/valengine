# RiskSmart Gateway Service Configuration
# Nacos Data ID: risk-smart-gateway-dev.yml
# Nacos Group: DEFAULT_GROUP

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: risk-smart-system
          uri: lb://risk-smart-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: risk-smart-data-middle-station
          uri: lb://risk-smart-data-middle-station
          predicates:
            - Path=/data/**
          filters:
            - StripPrefix=1
        - id: risk-smart-decision-manage
          uri: lb://risk-smart-decision-manage
          predicates:
            - Path=/decision/**
          filters:
            - StripPrefix=1
