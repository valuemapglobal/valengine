# RiskSmart System Service Configuration
# Nacos Data ID: risk-smart-system-dev.yml
# Nacos Group: DEFAULT_GROUP

spring:
  # 数据源配置
  datasource:
    druid:
      master:
        url: ${RS_DB_URL:jdbc:mysql://127.0.0.1:3306/risk_smart_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
        username: ${RS_DB_USER:root}
        password: ${RS_DB_PASS:root}
        driver-class-name: ${RS_DB_DRIVER:com.mysql.cj.jdbc.Driver}

  # Redis 配置
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.risksmart.system.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

# 安全配置 - 忽略认证的路径
security:
  ignore:
    whites:
      - /actuator/**
      - /system/user/selectOne
